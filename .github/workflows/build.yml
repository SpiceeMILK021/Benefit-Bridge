name: Build Windows EXE
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Tools
        run: pip install pyinstaller pillow
      - name: Create EXE
        run: pyinstaller --noconsole --windowed --add-data "benefit_bridge_logo.png;." BenefitBridge.py
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: dist/*.exe
