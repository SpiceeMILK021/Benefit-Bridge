name: Build Windows Version

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyinstaller pillow

      - name: Build EXE
        run: pyinstaller --noconsole --onefile --windowed --add-data "benefit_bridge_logo.png;." BenefitBridge.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: dist/*.exe
